        <span>DNA BARABAN</span>

        <button type="button" class="seg-btn large active mode-neighbor px-[24px] py-[20px] rounded-lg transition">Neighbor Revenge</button>
        <button type="button" class="seg-btn large mode-hitch px-[24px] py-[20px] rounded-lg transition">Hitchhiker Confessions</button>

        <select id="lang-select" class="px-[11px] py-[9px] rounded-md border border-[rgba(229,231,235,0.20)] bg-[rgba(255,255,255,0.05)] text-white">

          <option>Portuguese</option>

          <option>German</option>
          <option>Arabic</option>
          <option>Polish</option>

        <label for="length-select" class="sr-only">Длина текста</label>
        <select id="length-select" class="px-[11px] py-[9px] rounded-md border border-[rgba(229,231,235,0.20)] bg-[rgba(255,255,255,0.05)] text-white">
          <option selected>6,000 characters</option>
          <option>30,000 characters</option>
          <option>60,000 characters</option>
          <option>more than 100,000</option>

      // DNA BARABAN — UIPickerView-like для вариантов 1..11
      (function(){
        const main = document.getElementById('dna');

        function applyThemeByBtn(btn){
          const map = {
            'mode-neighbor': 'neighbor',
            'mode-hitch': 'hitch',
            'mode-soviet': 'soviet'
          };
          const key = Object.keys(map).find(k=>btn.classList.contains(k));
          if (!key) return;
          ['theme-neighbor','theme-hitch','theme-soviet'].forEach(cls=>main.classList.remove(cls));
          main.classList.add('theme-'+map[key]);
        }

        function makeActive(groupEl, btn){
          groupEl.querySelectorAll('.seg-btn').forEach(b=>{
            b.classList.remove('active');
          });
          btn.classList.add('active');
          if (groupEl.classList.contains('dna-genres')){
            applyThemeByBtn(btn);
            if (typeof window !== 'undefined' && window.__pickersReady) {
              resetPickers();
              // обновляем пункты пикеров по активному жанру
              const genreKey = getActiveGenreKey();
              if (typeof pickers !== 'undefined') {
                pickers.forEach((picker)=>{
                  const sectionIdx = (parseInt(picker.dataset.id || picker.getAttribute('data-id') || '0', 10) - 1) || 0;
                  const items = getSectionItems(genreKey, sectionIdx);
                  updatePickerItems(picker, items);
                });
              }
            }
          }
        }
        document.querySelectorAll('.group').forEach(group=>{
          group.addEventListener('click', (e)=>{
            const btn = e.target.closest('.seg-btn');
            if (!btn) return;
            makeActive(group, btn);
          });
        });

        // Инициализация темы по активной кнопке жанра

        function getActiveGenreKey(){
          const btn = document.querySelector('.dna-genres .seg-btn.active');
          if (!btn) return 'neighbor';
          if (btn.classList.contains('mode-neighbor')) return 'neighbor';
          if (btn.classList.contains('mode-hitch')) return 'hitch';
          if (btn.classList.contains('mode-soviet')) return 'soviet';
          return 'neighbor';
        }

        function getSectionItems(genreKey, index){
          const arr = CONTENT[genreKey] || CONTENT['neighbor'];
          return arr[index] || [];
        }

        function updatePickerItems(picker, items){
          const scroll = picker.querySelector('.picker-scroll');
          if (!scroll) return;
          const count = Array.isArray(items) ? items.length : 0;
          const repeat = DEFAULT_REPEAT;
          scroll.innerHTML = '';
          for (let r=0; r<repeat; r++){
            for (let i=0; i<count; i++){
              const li = document.createElement('li');
              li.className = 'picker-item';
              li.setAttribute('role','option');
              li.textContent = items[i] || `Вариант ${i+1}`;
              li.classList.add('h-10','flex','items-center','justify-center','select-none','cursor-pointer','text-white');
              scroll.appendChild(li);
            }
          }
          picker.dataset.count = String(count);
          picker.dataset.repeat = String(repeat);
          const centerStart = Math.floor(repeat/2) * count;
          const centerOffset = Math.max(0, (scroll.clientHeight - ITEM_HEIGHT) / 2);
          const base = 0;
          const currentLogical = parseInt(picker.dataset.index || '0', 10) || 0;
          const target = base + (centerStart + currentLogical) * ITEM_HEIGHT - centerOffset;
          scroll.scrollTo({ top: target });
        }

        function buildPicker(picker, label){
          const scroll = document.createElement('ul');
          scroll.className = 'picker-scroll';
          scroll.setAttribute('role','listbox');
          if (label) scroll.setAttribute('aria-label', label);
          scroll.classList.add('h-[200px]','overflow-y-auto','scroll-smooth');

          const genreKey = getActiveGenreKey();
          const sectionIdx = (parseInt(picker.dataset.id || picker.getAttribute('data-id') || '0', 10) - 1) || 0;
          const items = getSectionItems(genreKey, sectionIdx);
          const count = Array.isArray(items) ? items.length : 0;
          const repeat = DEFAULT_REPEAT;
          for (let r=0; r<repeat; r++){
            for (let i=0; i<count; i++){
              const li = document.createElement('li');
              li.className = 'picker-item';
              li.setAttribute('role','option');
              li.textContent = items[i] || `Вариант ${i+1}`;
              li.classList.add('h-10','flex','items-center','justify-center','select-none','cursor-pointer','text-white');
              scroll.appendChild(li);
            }
          }

          const highlight = document.createElement('span');
          highlight.className = 'picker-highlight';
          highlight.classList.add('pointer-events-none','absolute','inset-x-0','top-1/2','-translate-y-1/2','h-10','border-t-[0.5px]','border-b-[0.5px]','border-white/25','bg-white/5');
          const mask = document.createElement('span');
          mask.className = 'picker-mask';
          mask.classList.add('pointer-events-none','absolute','inset-0','bg-gradient-to-b','from-[rgba(11,12,16,0.65)]','via-transparent','to-[rgba(11,12,16,0.65)]');

          picker.append(scroll, highlight, mask);

          picker.dataset.count = String(count);
          picker.dataset.repeat = String(repeat);
          picker.dataset.index = '0';

          function logicalIndexFromScrollTop(){
            const centerOffset = Math.max(0, (scroll.clientHeight - ITEM_HEIGHT) / 2);
            const visibleIndex = Math.round((scroll.scrollTop + centerOffset) / ITEM_HEIGHT);
            const logicalCount = parseInt(picker.dataset.count || String(count), 10) || count || 1;
            const bounded = ((visibleIndex % logicalCount) + logicalCount) % logicalCount;
            return { visibleIndex, bounded };
          }
          function recenterIfNeeded(){
            const logicalCount = parseInt(picker.dataset.count || String(count), 10) || count || 1;
            const repeatNum = parseInt(picker.dataset.repeat || String(repeat), 10) || repeat || 5;
            const total = logicalCount * repeatNum;
            const centerStart = Math.floor(repeatNum/2) * logicalCount;
            const centerOffset = Math.max(0, (scroll.clientHeight - ITEM_HEIGHT) / 2);
            const { visibleIndex, bounded } = logicalIndexFromScrollTop();
            const threshold = logicalCount;
            if (visibleIndex < threshold || visibleIndex > total - threshold){
              const targetIndex = centerStart + bounded;
              const targetTop = targetIndex * ITEM_HEIGHT - centerOffset;
              scroll.scrollTo({ top: targetTop });
            }
          }
          function applySelection(){
            const { visibleIndex, bounded } = logicalIndexFromScrollTop();
            picker.dataset.index = String(bounded);
            const itemsEls = Array.from(scroll.querySelectorAll('.picker-item'));
            itemsEls.forEach(el=>el.classList.remove('selected'));
            const sel = itemsEls[visibleIndex];
            if (sel) sel.classList.add('selected');
          }
          function snap(){
            recenterIfNeeded();
            applySelection();
          }
          let snapTimer;
          scroll.addEventListener('scroll', ()=>{
            clearTimeout(snapTimer);
            snapTimer = setTimeout(snap, 120);
          });
          scroll.addEventListener('click', (e)=>{
            const li = e.target.closest('.picker-item');
            if (!li) return;
            const itemsEls = Array.from(scroll.querySelectorAll('.picker-item'));
            const idx = itemsEls.indexOf(li);
            const centerOffset = Math.max(0, (scroll.clientHeight - ITEM_HEIGHT) / 2);
            const logicalCount = parseInt(picker.dataset.count || String(count), 10) || count || 1;
            const repeatNum = parseInt(picker.dataset.repeat || String(repeat), 10) || repeat || 5;
            const centerStart = Math.floor(repeatNum/2) * logicalCount;
            const bounded = ((idx % logicalCount) + logicalCount) % logicalCount;
            picker.dataset.index = String(bounded);
            const targetIndex = centerStart + bounded;
            const targetTop = targetIndex * ITEM_HEIGHT - centerOffset;
            itemsEls.forEach(el=>el.classList.remove('selected'));
            if (itemsEls[idx]) itemsEls[idx].classList.add('selected');
            scroll.scrollTo({ top: targetTop, behavior: 'smooth' });
          });
          let isDown = false;
          let startY = 0;
          let startTop = 0;
          let lastY = 0;
          let lastT = 0;
          let velocity = 0;
          let inertiaId = null;
          function endDrag(){
            if (!isDown) return;
            isDown = false;
            picker.classList.remove('grabbing');
            const decel = 0.003;
            let last = performance.now();
            function step(ts){
              const dt = ts - last;
              last = ts;
              const sign = velocity > 0 ? 1 : -1;
              const v = Math.abs(velocity);
              if (v <= 0.0001) { snap(); return; }
              const delta = sign * v * dt * 16;
              scroll.scrollTop += delta;
              velocity = sign * Math.max(0, v - decel * dt);
              inertiaId = requestAnimationFrame(step);
            }
            inertiaId = requestAnimationFrame(step);
          }
          scroll.addEventListener('pointerdown', (e)=>{
            isDown = true;
            picker.classList.add('grabbing');
            scroll.setPointerCapture(e.pointerId);
            startY = e.clientY;
            startTop = scroll.scrollTop;
            lastY = e.clientY;
            lastT = performance.now();
            velocity = 0;
            clearTimeout(snapTimer);
            if (inertiaId) cancelAnimationFrame(inertiaId);
          });
          scroll.addEventListener('pointermove', (e)=>{
            if (!isDown) return;
            const dy = e.clientY - startY;
            scroll.scrollTop = startTop - dy;
            const now = performance.now();
            const dt = now - lastT;
            if (dt > 16){
              velocity = (lastY - e.clientY) / dt;
              lastY = e.clientY;
              lastT = now;
            }
          });
          scroll.addEventListener('pointerup', endDrag);
          scroll.addEventListener('pointercancel', endDrag);

          const centerStart = Math.floor(repeat/2) * (count || 1);
          const centerOffset = Math.max(0, (scroll.clientHeight - ITEM_HEIGHT) / 2);
          scroll.scrollTo({ top: centerStart * ITEM_HEIGHT - centerOffset });
          applySelection();
        }

        function getPickerValue(picker){
          const i = parseInt(picker.dataset.index || '0', 10);
          const genreKey = getActiveGenreKey();
          const sectionIdx = (parseInt(picker.dataset.id || picker.getAttribute('data-id') || '0', 10) - 1) || 0;
          const items = getSectionItems(genreKey, sectionIdx);
          return items[i] || `Вариант ${i+1}`;
        }
        function setPickerIndex(picker, i){
          const scroll = picker.querySelector('.picker-scroll');
          const count = parseInt(picker.dataset.count || '0', 10) || 1;
          const repeatNum = parseInt(picker.dataset.repeat || String(DEFAULT_REPEAT), 10) || DEFAULT_REPEAT;
          const bounded = ((i % count) + count) % count;
          picker.dataset.index = String(bounded);
          const centerStart = Math.floor(repeatNum/2) * count;
          const centerOffset = Math.max(0, (scroll.clientHeight - ITEM_HEIGHT) / 2);
          const targetTop = (centerStart + bounded) * ITEM_HEIGHT - centerOffset;
          const itemsEls = Array.from(scroll.querySelectorAll('.picker-item'));
          itemsEls.forEach(el=>el.classList.remove('selected'));
          scroll.scrollTo({ top: targetTop, behavior: 'smooth' });
        }

        const pickers = Array.from(document.querySelectorAll('.baraban-box .picker'));
        pickers.forEach((picker, idx)=>{
          const label = picker.parentElement.querySelector('.baraban-title')?.textContent?.trim() || `BARABAN ${idx+1}`;
          buildPicker(picker, label);
        });
        // флаг готовности пикеров для безопасного сброса при смене жанра
        if (typeof window !== 'undefined') { window.__pickersReady = true; }

        function randomize(){
          pickers.forEach(picker=>{
            const count = parseInt(picker.dataset.count || '0', 10) || 1;
            const i = Math.floor(Math.random()*count);
            setPickerIndex(picker, i);
          });
        }

        function resetPickers(){
          // При смене жанра сбрасываем выбор всех барабанов на первый вариант
          pickers.forEach(picker=> setPickerIndex(picker, 0));
        }

        document.getElementById('btn-random')?.addEventListener('click', randomize);
        document.addEventListener('click', (e)=>{
          const btn = e.target.closest('.shuffle-btn');
          if (!btn) return;
          const id = parseInt(btn.dataset.id || btn.getAttribute('data-id') || '0', 10);
          const picker = document.querySelector(`.baraban-box .picker[data-id="${id}"]`);
          if (!picker) return;
          const count = parseInt(picker.dataset.count || '0', 10) || 1;
          const i = Math.floor(Math.random()*count);
          setPickerIndex(picker, i);
        });

        const modal = document.getElementById('result-modal');
        const resultPre = document.getElementById('result-json');
        const btnCopyJson = document.getElementById('btn-copy-json');
        const btnClose = document.getElementById('btn-close-modal');
        const overlay = document.getElementById('modal-overlay');

        function openModal(){
          if (modal) {
            modal.classList.remove('hidden');
            modal.classList.add('flex');
          }
        }
        function closeModal(){
          if (modal) {
            modal.classList.add('hidden');
            modal.classList.remove('flex');
          }
        }
        function copyText(text){
          if (navigator.clipboard && typeof navigator.clipboard.writeText === 'function') {
            navigator.clipboard.writeText(text);
          } else {
            const ta = document.createElement('textarea');
            ta.value = text;
            document.body.appendChild(ta);
            ta.select();
            try { document.execCommand('copy'); } catch(e) {}
            ta.remove();
          }
        }
        btnCopyJson?.addEventListener('click', ()=>{
          const text = resultPre?.textContent || '';
          copyText(text);
        });
        btnClose?.addEventListener('click', closeModal);
        overlay?.addEventListener('click', closeModal);
        document.addEventListener('keydown', (e)=>{ if (e.key === 'Escape') closeModal(); });

        

        document.getElementById('btn-make')?.addEventListener('click', ()=>{
          const genre = Array.from(document.querySelectorAll('.dna-genres .seg-btn')).find(b=>b.classList.contains('active'))?.textContent?.trim();
          const language = document.getElementById('lang-select')?.value?.trim();
          const length = document.getElementById('length-select')?.value?.trim();
          const labels = pickers.map((picker, idx)=> picker.parentElement.querySelector('.baraban-title')?.textContent?.trim() || `BARABAN ${idx+1}`);
          const values = pickers.map((picker)=> getPickerValue(picker));
          const sections = labels.reduce((acc, name, i)=>{ acc[name] = values[i]; return acc; }, {});
          const payload = { genre, language, length, sections };
          const jsonText = JSON.stringify(payload, null, 2);
          if (resultPre) resultPre.textContent = jsonText;
          console.log('MAKE STORY payload (compact):', payload);
          openModal();
        });
      })();
