        <button type="button" class="seg-btn large mode-hitch px-[24px] py-[20px] rounded-lg transition">Confession Of Hitchhikers</button>
        <button type="button" class="seg-btn large mode-soviet px-[24px] py-[20px] rounded-lg transition">Soviet True Crime</button>
      </nav>

      <nav class="group dna-langs flex flex-wrap justify-center gap-[12px] py-[22px]" data-name="language" aria-label="Выбор языка">
        <button type="button" class="seg-btn px-[11px] py-[9px] rounded-md transition">French</button>
        <button type="button" class="seg-btn px-[11px] py-[9px] rounded-md transition">Finnish</button>
        <button type="button" class="seg-btn px-[11px] py-[9px] rounded-md transition">Portuguese</button>
        <button type="button" class="seg-btn px-[11px] py-[9px] rounded-md transition active">English</button>
        <button type="button" class="seg-btn px-[11px] py-[9px] rounded-md transition">German</button>
        <button type="button" class="seg-btn px-[11px] py-[9px] rounded-md transition">Arabic</button>
        <button type="button" class="seg-btn px-[11px] py-[9px] rounded-md transition">Polish</button>
      </nav>

          const map = {
            'mode-neighbor': 'neighbor',
            'mode-hitch': 'hitch',
            'mode-soviet': 'soviet'
          };
          const key = Object.keys(map).find(k=>btn.classList.contains(k));
          if (!key) return;
          ['theme-neighbor','theme-hitch','theme-soviet'].forEach(cls=>main.classList.remove(cls));
          main.classList.add('theme-'+map[key]);
        }

        function makeActive(groupEl, btn){
          groupEl.querySelectorAll('.seg-btn').forEach(b=>{
            b.classList.remove('active');

            applyThemeByBtn(btn);

                  const sectionIdx = (parseInt(picker.dataset.id || picker.getAttribute('data-id') || '0', 10) - 1) || 0;

        function getActiveGenreKey(){
          const btn = document.querySelector('.dna-genres .seg-btn.active');
          if (!btn) return 'neighbor';
          if (btn.classList.contains('mode-neighbor')) return 'neighbor';
          if (btn.classList.contains('mode-hitch')) return 'hitch';
          if (btn.classList.contains('mode-soviet')) return 'soviet';
          return 'neighbor';
        }

        function getSectionItems(genreKey, index){
          const arr = CONTENT[genreKey] || CONTENT['neighbor'];
          return arr[index] || [];
        }

        function updatePickerItems(picker, items){
          const scroll = picker.querySelector('.picker-scroll');
          const nodes = Array.from(scroll.querySelectorAll('.picker-item'));
          for (let i=0; i<NUM_OPTIONS; i++){
            if (nodes[i]) nodes[i].textContent = items?.[i] || `Вариант ${i+1}`;
          }
        }

        function buildPicker(picker, label){
          const scroll = document.createElement('ul');
          scroll.className = 'picker-scroll';
          scroll.setAttribute('role','listbox');
          if (label) scroll.setAttribute('aria-label', label);
          // Tailwind стили для списка прокрутки
          scroll.classList.add('h-[200px]','overflow-y-auto','scroll-smooth');

          // две пустые строки сверху
          const topPad1 = document.createElement('li');
          topPad1.className = 'picker-spacer';
          topPad1.classList.add('h-10');
          const topPad2 = document.createElement('li');
          topPad2.className = 'picker-spacer';
          topPad2.classList.add('h-10');

          // две пустые строки снизу
          const bottomPad1 = document.createElement('li');
          bottomPad1.className = 'picker-spacer';
          bottomPad1.classList.add('h-10');
          const bottomPad2 = document.createElement('li');
          bottomPad2.className = 'picker-spacer';
          bottomPad2.classList.add('h-10');

          scroll.append(topPad1, topPad2);
          // заполняем элементы согласно активному жанру и секции
          const genreKey = getActiveGenreKey();
          const sectionIdx = (parseInt(picker.dataset.id || picker.getAttribute('data-id') || '0', 10) - 1) || 0;
          const items = getSectionItems(genreKey, sectionIdx);
          for (let i=1;i<=NUM_OPTIONS;i++){
            const li = document.createElement('li');
            li.className = 'picker-item';
            li.setAttribute('role','option');
            li.textContent = items[i-1] || `Вариант ${i}`;
            // Tailwind стили для элемента
            li.classList.add('h-10','flex','items-center','justify-center','select-none','cursor-pointer','text-white');
            scroll.appendChild(li);
          }
          scroll.append(bottomPad1, bottomPad2);

          const highlight = document.createElement('span');
          highlight.className = 'picker-highlight';
          // Tailwind стили подсветки активной строки
          highlight.classList.add('pointer-events-none','absolute','inset-x-0','top-1/2','-translate-y-1/2','h-10','border-t-[0.5px]','border-b-[0.5px]','border-white/25','bg-white/5');
          const mask = document.createElement('span');
          mask.className = 'picker-mask';
          // Tailwind стили маски исчезания краёв
          mask.classList.add('pointer-events-none','absolute','inset-0','bg-gradient-to-b','from-[rgba(11,12,16,0.65)]','via-transparent','to-[rgba(11,12,16,0.65)]');

          // контейнер picker уже имеет relative
          picker.append(scroll, highlight, mask);

          picker.dataset.count = String(NUM_OPTIONS);
          picker.dataset.index = '0';

          function baseOffset(){
            const firstItem = scroll.querySelector('.picker-item');
            return firstItem ? firstItem.offsetTop : 2*ITEM_HEIGHT; // по умолчанию 2 строки сверху
          }

          function snap(){
            const base = baseOffset();
            const centerOffset = Math.max(0, (scroll.clientHeight - ITEM_HEIGHT) / 2);
            const i = Math.round((scroll.scrollTop + centerOffset - base) / ITEM_HEIGHT);
            const bounded = Math.max(0, Math.min(NUM_OPTIONS-1, i));
            picker.dataset.index = String(bounded);
            // update selected item styling
            const items = Array.from(scroll.querySelectorAll('.picker-item'));
            items.forEach(el=>el.classList.remove('selected'));
            const sel = items[bounded];
            if (sel) sel.classList.add('selected');
            const target = base + bounded * ITEM_HEIGHT - centerOffset;
            scroll.scrollTo({ top: target, behavior: 'smooth' });
          }
          let snapTimer;
          scroll.addEventListener('scroll', ()=>{
            clearTimeout(snapTimer);
            snapTimer = setTimeout(snap, 120);
          });
          scroll.addEventListener('click', (e)=>{
            const li = e.target.closest('.picker-item');
            if (!li) return;
            const items = Array.from(scroll.querySelectorAll('.picker-item'));
            const idx = items.indexOf(li);
            const base = baseOffset();
            const centerOffset = Math.max(0, (scroll.clientHeight - ITEM_HEIGHT) / 2);
            picker.dataset.index = String(idx);
            // update selected immediately
            items.forEach(el=>el.classList.remove('selected'));
            if (items[idx]) items[idx].classList.add('selected');
            const target = base + idx * ITEM_HEIGHT - centerOffset;
            scroll.scrollTo({ top: target, behavior: 'smooth' });
          });

          // initial center
          snap();
        }

        function getPickerValue(picker){
          const i = parseInt(picker.dataset.index || '0', 10);
          const items = Array.from(picker.querySelectorAll('.picker-item'));
          const el = items[i];
          return el ? el.textContent : `Вариант ${i+1}`;
        }
        function setPickerIndex(picker, i){
          const scroll = picker.querySelector('.picker-scroll');
          const base = (function(){
            const firstItem = scroll.querySelector('.picker-item');
            return firstItem ? firstItem.offsetTop : 2*ITEM_HEIGHT;
          })();
          const count = parseInt(picker.dataset.count || String(NUM_OPTIONS), 10);
          const bounded = Math.max(0, Math.min(count-1, i));
          picker.dataset.index = String(bounded);
          // update selected item styling
          const items = Array.from(scroll.querySelectorAll('.picker-item'));
          items.forEach(el=>el.classList.remove('selected'));
          const sel = items[bounded];
          if (sel) sel.classList.add('selected');
          const centerOffset = Math.max(0, (scroll.clientHeight - ITEM_HEIGHT) / 2);
          scroll.scrollTo({ top: base + bounded * ITEM_HEIGHT - centerOffset, behavior: 'smooth' });
        }

        const pickers = Array.from(document.querySelectorAll('.baraban-box .picker'));
        pickers.forEach((picker, idx)=>{
          const label = picker.parentElement.querySelector('.baraban-title')?.textContent?.trim() || `BARABAN ${idx+1}`;
          buildPicker(picker, label);
        });
        // флаг готовности пикеров для безопасного сброса при смене жанра
        if (typeof window !== 'undefined') { window.__pickersReady = true; }

        function randomize(){
          pickers.forEach(picker=>{
            const i = Math.floor(Math.random()*NUM_OPTIONS);
            setPickerIndex(picker, i);
          });
        }

        function resetPickers(){
          // При смене жанра сбрасываем выбор всех барабанов на первый вариант
          pickers.forEach(picker=> setPickerIndex(picker, 0));
        }

        document.getElementById('btn-random')?.addEventListener('click', randomize);

        document.getElementById('btn-make')?.addEventListener('click', ()=>{
          const genre = Array.from(document.querySelectorAll('.dna-genres .seg-btn')).find(b=>b.classList.contains('active'))?.textContent?.trim();
          const language = Array.from(document.querySelectorAll('.dna-langs .seg-btn')).find(b=>b.classList.contains('active'))?.textContent?.trim();
          const length = Array.from(document.querySelectorAll('.dna-length .seg-btn')).find(b=>b.classList.contains('active'))?.textContent?.trim();
          const bars = pickers.map((picker, idx)=>({ id: idx+1, value: getPickerValue(picker) }));
          const payload = { genre, language, length, bars };
          console.log('MAKE STORY payload:', payload);
          alert('Собран UI-пакет (см. консоль):\n'+JSON.stringify(payload, null, 2));
        });
      })();
    </script>
  </body>
</html>
