  <script>
    // Обновление процентов темперамента
    document.getElementById('primaryPercent').addEventListener('input', e => {
      const primaryValue = parseInt(e.target.value);
      const secondaryValue = 100 - primaryValue;
      
      document.getElementById('primaryPercentValue').textContent = primaryValue + '%';
      document.getElementById('secondaryPercent').value = secondaryValue;
      document.getElementById('secondaryPercentValue').textContent = secondaryValue + '%';
    });
    
    document.getElementById('secondaryPercent').addEventListener('input', e => {
      const secondaryValue = parseInt(e.target.value);
      const primaryValue = 100 - secondaryValue;
      
      document.getElementById('secondaryPercentValue').textContent = secondaryValue + '%';
      document.getElementById('primaryPercent').value = primaryValue;
      document.getElementById('primaryPercentValue').textContent = primaryValue + '%';
    });

    function generateCard() {
      const form = document.getElementById('characterForm');
      const fits = Array.from(document.querySelectorAll('#fit input:checked')).map(cb => cb.value).join(', ');
      const outfitStyles = Array.from(document.querySelectorAll('#outfitStyle input:checked')).map(cb => cb.value).join(', ');
      const temperament = `${form.primaryTemperament.value} ${form.primaryPercent.value}% / ${form.secondaryTemperament.value} ${form.secondaryPercent.value}%`;

      const output = `# 📄 MODEL CARDD

**🍎 NAME:** ${form.name.value}
**🦊 ID:** ${form.nickname.value}
**🌎 NATIONALITY:** ${form.origin.value}
**🤢 AGE:** ${form.age.value}
**📍 ADDRESS:** ${form.location.value}
**💊 LOOK:** ${fits}
**🍓 SEXUALITY:** ${form.sexuality.value}
**🥸 SASS TYPE:** ${form['sass-type'].value}
**🤪 SECRET:** ${form.secret.value}
**🧙 MODEL ROLE:** ${form.modelRole.value}

## 🥥 BODY
**💅 BODY SPECS:** ${form.figure.value}
**🍈 TITS:** ${form.bust.value}
**👁️ EYES:** ${form.eye.value}
**💇 HAIR:** ${form.hairColor.value}, ${form.hairStyle.value}
**👤 FACE TYPE:** ${form.faceType.value}
**🎯 UNIQUE FEATURE:** ${form.uniqueFeature.value}
**📏 HEIGHT:** ${form.height.value}
**🍑 HIPS TYPE:** ${form.hipsType.value}
**🎨 SKIN TONE:** ${form.skinTone.value}

## 🌟 PERSONALITY
**💫 VIBE:** ${form.vibe.value}
**📖 CHARACTER LORE:** ${form.characterLore.value}

## 👗 STYLE
**👕 OUTFIT STYLE:** ${outfitStyles}
**🎬 BACKGROUND STYLE:** ${form.backgroundStyle.value}

## 🌼 QUALIFICATIONS
**TEMPERAMENT:** ${temperament}
**MBTI:** ${form.mbti.value}

## ❤️ LIKES
${form.secret.value}, ${form.sexuality.value}, ${form['sass-type'].value}

## 😋 INSPIRED BY
${form.intimacy.value}, ${form.backstory.value}

## 🛰️ MY BUTT
@instagram, @fanvue, @telegram

#hashtags: #badgirlmode #undressedthoughts #laceonhips #noshame`;

      const blob = new Blob([output], { type: 'text/markdown' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'model_cardd.md';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }
  </script>
